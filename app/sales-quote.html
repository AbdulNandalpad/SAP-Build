<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSS CX Analytics — Sales Quotes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --blue:#2563eb;--blue2:#1d4ed8;--blue-light:#dbeafe;--blue-xlight:#eff6ff;
  --green:#059669;--green-light:#d1fae5;
  --red:#dc2626;--red-light:#fee2e2;
  --orange:#d97706;--orange-light:#ffedd5;
  --purple:#7c3aed;--purple-light:#ede9fe;
  --teal:#0d9488;--gold:#c2781f;
  --text:#0f172a;--muted:#64748b;--light:#94a3b8;
  --border:#e2e8f0;--border2:#cbd5e1;
  --bg:#f1f5f9;--card:#ffffff;--shell:#0f172a;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.05);
  --shadow:0 4px 16px rgba(0,0,0,0.07),0 2px 4px rgba(0,0,0,0.04);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}

.shell{background:var(--shell);height:68px;display:flex;align-items:center;padding:0 24px;gap:14px;position:sticky;top:0;z-index:200;}
.shell-div{width:1px;height:20px;background:rgba(255,255,255,0.12);margin:0 14px;}
.shell-app{font-size:0.75rem;color:rgba(255,255,255,0.45);}
.shell-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
.shell-status{display:flex;align-items:center;gap:5px;font-size:0.7rem;color:rgba(255,255,255,0.45);}
.live-dot{width:5px;height:5px;border-radius:50%;background:#22c55e;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}
.shell-back{font-size:0.72rem;color:rgba(255,255,255,0.55);text-decoration:none;display:flex;align-items:center;gap:5px;padding:5px 12px;border:1px solid rgba(255,255,255,0.12);border-radius:6px;transition:all 0.15s;font-weight:500;}
.shell-back:hover{background:rgba(255,255,255,0.08);color:white;}
.shell-back svg{width:12px;height:12px;}

.page-hdr{background:white;border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.page-title{font-size:1.05rem;font-weight:600;color:var(--text);}
.page-sub{font-size:0.72rem;color:var(--muted);margin-top:2px;}
.page-actions{display:flex;gap:8px;}
.btn{font-size:0.76rem;padding:6px 14px;border-radius:7px;cursor:pointer;border:1px solid var(--border2);background:white;color:var(--text);font-family:'Inter',sans-serif;display:flex;align-items:center;gap:5px;transition:background 0.15s;}
.btn:hover{background:var(--bg);}
.btn svg{width:12px;height:12px;}

.filter-bar{background:white;border-bottom:1px solid var(--border);padding:8px 24px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.fl{font-size:0.71rem;color:var(--muted);font-weight:500;white-space:nowrap;}
.fsep{width:1px;height:20px;background:var(--border);}
select,input[type=number]{background:white;color:var(--text);border:1px solid var(--border2);padding:4px 10px;border-radius:6px;font-size:0.77rem;font-family:'Inter',sans-serif;height:30px;cursor:pointer;}
select:focus,input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(37,99,235,0.12);}
.btn-clear{font-size:0.71rem;color:var(--muted);background:none;border:1px solid var(--border);padding:4px 10px;border-radius:6px;cursor:pointer;font-family:'Inter',sans-serif;height:30px;}
.btn-clear:hover{background:var(--bg);color:var(--text);}
.filter-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.ts{font-size:0.68rem;color:var(--light);}

.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border);border-bottom:1px solid var(--border);}
.kpi{background:white;padding:16px 20px;position:relative;}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2.5px;}
.kpi:nth-child(1)::before{background:linear-gradient(90deg,var(--blue),#60a5fa);}
.kpi:nth-child(2)::before{background:linear-gradient(90deg,var(--green),#34d399);}
.kpi:nth-child(3)::before{background:linear-gradient(90deg,var(--orange),#fb923c);}
.kpi:nth-child(4)::before{background:linear-gradient(90deg,var(--red),#f87171);}
.kpi:nth-child(5)::before{background:linear-gradient(90deg,var(--purple),#c084fc);}
.kv{font-size:1.65rem;font-weight:300;line-height:1.1;margin-top:4px;color:var(--text);letter-spacing:-0.5px;}
.kl{font-size:0.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;font-weight:600;}
.ks{font-size:0.68rem;color:var(--light);margin-top:3px;}

.content{padding:14px 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.panel{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow-sm);}
.panel.w2{grid-column:span 2;}
.panel.w3{grid-column:span 3;}
.panel-hdr{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.panel-hdr h3{font-size:0.8rem;font-weight:600;color:var(--text);}
.ph-tag{font-size:0.6rem;color:var(--muted);background:var(--bg);padding:2px 8px;border:1px solid var(--border);border-radius:4px;font-weight:500;}
.ph-tag.live{background:var(--green-light);color:var(--green);border-color:rgba(5,150,105,0.2);}
.panel-body{padding:12px 16px;}
canvas{max-height:200px;}
.leg{display:flex;flex-wrap:wrap;gap:8px;padding:4px 16px 10px;}
.leg-i{display:flex;align-items:center;gap:4px;font-size:0.67rem;color:var(--muted);}
.leg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}

.tbl-panel{background:white;border:1px solid var(--border);border-radius:10px;overflow:hidden;grid-column:span 3;box-shadow:var(--shadow-sm);}
.tbl-hdr{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.tbl-hdr h3{font-size:0.8rem;font-weight:600;}
.tbl-ct{font-size:0.67rem;color:var(--muted);background:var(--bg);padding:2px 8px;border:1px solid var(--border);border-radius:4px;}
table{width:100%;border-collapse:collapse;font-size:0.74rem;}
th{background:#f8fafc;color:var(--muted);padding:8px 12px;text-align:left;font-weight:600;font-size:0.62rem;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:0.4px;white-space:nowrap;}
td{padding:8px 12px;border-bottom:1px solid #f1f5f9;color:var(--text);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#f8fafc;}
.badge{padding:2px 8px;border-radius:8px;font-size:0.62rem;font-weight:600;}
.b-open{background:var(--blue-light);color:#1e3a8a;}
.b-won{background:var(--green-light);color:#065f46;}
.b-lost{background:var(--red-light);color:#7f1d1d;}
.b-expired{background:var(--orange-light);color:#9a3412;}
.b-other{background:var(--bg);color:var(--muted);border:1px solid var(--border);}
.c4c-link{color:var(--blue);text-decoration:none;font-size:0.65rem;display:flex;align-items:center;gap:3px;}
.c4c-link:hover{text-decoration:underline;}
.c4c-link svg{width:9px;height:9px;}
.loading-msg{grid-column:span 3;padding:48px;text-align:center;color:var(--muted);font-size:0.85rem;}
@media(max-width:900px){
  .kpi-row{grid-template-columns:repeat(3,1fr);}
  .content{grid-template-columns:1fr 1fr;}
  .panel.w2,.panel.w3{grid-column:span 2;}
  .tbl-panel{grid-column:span 2;}
}
@media(max-width:640px){
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  .content{grid-template-columns:1fr;}
  .panel.w2,.panel.w3,.tbl-panel{grid-column:span 1;}
  .page-hdr{flex-direction:column;align-items:flex-start;}
  .filter-bar{overflow-x:auto;flex-wrap:nowrap;gap:8px;}
  .fl{flex-shrink:0;}
  select,input[type=number]{flex-shrink:0;}
  .filter-right{flex-shrink:0;}
  table{min-width:700px;}
  .tbl-panel{overflow-x:auto;}
  .shell{padding:0 12px;}
}
</style>
</head>
<body>

<div class="shell">
  <a href="/" style="display:flex;align-items:center;gap:8px;text-decoration:none;flex-shrink:0;"><div style="width:32px;height:32px;background:#a39245;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:800;color:white;letter-spacing:0.5px;">TSS</div><span style="font-size:0.88rem;font-weight:600;color:white;letter-spacing:0.3px;">CX Analytics</span></a>
  <div class="shell-div"></div>
  <span class="shell-app">Sales Quotes</span>
  <div class="shell-right">
    <div class="shell-status"><div class="live-dot"></div>C4C QUA · MY352500</div>
    <a href="/logout" style="display:flex;align-items:center;gap:5px;color:rgba(255,255,255,0.5);font-size:0.72rem;text-decoration:none;padding:5px 10px;border:1px solid rgba(255,255,255,0.15);border-radius:6px;transition:all 0.2s;" onmouseover="this.style.color='white';this.style.borderColor='rgba(255,255,255,0.4)'" onmouseout="this.style.color='rgba(255,255,255,0.5)';this.style.borderColor='rgba(255,255,255,0.15)'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Sign Out</a><a href="index.html" class="shell-back">
      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2L4 6l4 4"/></svg>
      Home
    </a>
  </div>
</div>

<div class="page-hdr">
  <div>
    <div class="page-title">Sales Quote Analytics</div>
    <div class="page-sub" id="pageSub">Loading data from C4C QUA...</div>
  </div>
  <div class="page-actions">
    <button class="btn" onclick="window.print()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Export
    </button>
    <button class="btn" onclick="location.reload()" style="background:var(--blue);color:white;border-color:var(--blue);">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Refresh
    </button>
  </div>
</div>

<div class="filter-bar">
  <span class="fl">Sales Org</span>
  <select id="fOrg" onchange="applyFilters()"><option value="">All</option></select>
  <span class="fl">Status</span>
  <select id="fStatus" onchange="applyFilters()">
    <option value="">All</option>
    <option value="1">Open</option>
    <option value="2">Won / Ordered</option>
    <option value="3">Lost</option>
    <option value="4">Expired</option>
  </select>
  <span class="fl">Owner</span>
  <select id="fOwner" onchange="applyFilters()"><option value="">All</option></select>
  <span class="fl">From Year</span>
  <input type="number" id="fYear" value="2024" min="2020" max="2030" style="width:74px;" onchange="applyFilters()" />
  <button class="btn-clear" onclick="clearFilters()">Clear</button>
  <div class="filter-right">
    <div class="shell-status"><div class="live-dot"></div></div>
    <span class="ts" id="lastUpdate">Loading...</span>
  </div>
</div>

<div class="kpi-row" id="kpiRow">
  <div class="kpi"><div class="kl">Total Quotes</div><div class="kv">—</div></div>
  <div class="kpi"><div class="kl">Total Net Value</div><div class="kv">—</div></div>
  <div class="kpi"><div class="kl">Open Quotes</div><div class="kv">—</div></div>
  <div class="kpi"><div class="kl">Won / Ordered</div><div class="kv">—</div></div>
  <div class="kpi"><div class="kl">Lost / Expired</div><div class="kv">—</div></div>
</div>

<div class="content" id="mainContent">
  <div class="loading-msg">Loading Sales Quote data from C4C...</div>
</div>

<script>
var allData=[], filtered=[], charts={};
var C4C_BASE='https://my352500.crm.ondemand.com/sap/public/byd/runtime?bo_ns=http://sap.com/thingTypes&bo=COD_GENERIC&node=Root&operation=OnExtInspect&OBNRedirect=X';
var SAP=['#2563eb','#059669','#d97706','#dc2626','#7c3aed','#0d9488','#b45309','#64748b','#1589ee','#0aaf67'];

function fmt(n){n=parseFloat(n)||0;if(n>=1e9)return'$'+(n/1e9).toFixed(1)+'B';if(n>=1e6)return'$'+(n/1e6).toFixed(1)+'M';if(n>=1e3)return'$'+(n/1e3).toFixed(0)+'K';return'$'+n.toFixed(0);}
function fmtN(n){n=parseFloat(n)||0;if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(0)+'K';return n.toFixed(0);}
function pd(v){if(!v)return null;var m=String(v).match(/\/Date\((\d+)\)\//);if(m)return new Date(parseInt(m[1]));return new Date(v);}
function pds(v){var d=pd(v);if(!d||isNaN(d))return'—';return d.toISOString().substring(0,10);}
function yr(v){var d=pd(v);return(!d||isNaN(d))?null:d.getFullYear();}

function stLabel(s){return s==='1'?'Open':s==='2'?'Won':s==='3'?'Lost':s==='4'?'Expired':'Other';}
function stClass(s){return s==='1'?'b-open':s==='2'?'b-won':s==='3'?'b-lost':s==='4'?'b-expired':'b-other';}
var stColors={'Open':'#0a6ed1','Won':'#107e3e','Lost':'#bb0000','Expired':'#e9730c','Other':'#94a3b8'};

async function fetchAll(){
  var url='/odata/v4/quotes/SalesQuotes?$top=1000', all=[];
  while(url){
    var r=await fetch(url);var j=await r.json();
    if(j.error)throw new Error(j.error.message);
    all=all.concat(j.value||[]);
    url=j['@odata.nextLink']?'/odata/v4/quotes/'+j['@odata.nextLink']:null;
  }
  return all;
}

function populateFilters(data){
  var orgs=[...new Set(data.map(function(d){return d.SalesOrganisationName||d.SalesOrganisationID;}).filter(Boolean))].sort();
  orgs.forEach(function(o){var e=document.createElement('option');e.value=o;e.textContent=o;document.getElementById('fOrg').appendChild(e);});
  var owners=[...new Set(data.map(function(d){return d.MainEmployeeResponsiblePartyName;}).filter(Boolean))].sort();
  owners.forEach(function(o){var e=document.createElement('option');e.value=o;e.textContent=o;document.getElementById('fOwner').appendChild(e);});
}

function clearFilters(){
  document.getElementById('fOrg').value='';
  document.getElementById('fStatus').value='';
  document.getElementById('fOwner').value='';
  document.getElementById('fYear').value='2024';
  applyFilters();
}

function applyFilters(){
  var org=document.getElementById('fOrg').value;
  var status=document.getElementById('fStatus').value;
  var owner=document.getElementById('fOwner').value;
  var year=parseInt(document.getElementById('fYear').value)||2024;
  filtered=allData.filter(function(d){
    if(org&&(d.SalesOrganisationName||d.SalesOrganisationID)!==org)return false;
    if(status&&d.LifeCycleStatusCode!==status)return false;
    if(owner&&d.MainEmployeeResponsiblePartyName!==owner)return false;
    var y=yr(d.CreationDateTime);
    if(y&&y<year)return false;
    return true;
  });
  renderKPIs();renderContent();
}

function renderKPIs(){
  var d=filtered;
  var open=d.filter(function(x){return x.LifeCycleStatusCode==='1';}).length;
  var won=d.filter(function(x){return x.LifeCycleStatusCode==='2';}).length;
  var lost=d.filter(function(x){return x.LifeCycleStatusCode==='3';}).length;
  var expired=d.filter(function(x){return x.LifeCycleStatusCode==='4';}).length;
  var rev=d.reduce(function(s,x){return s+parseFloat(x.TotalNetAmount||x.TotalGrossAmount||0);},0);
  var wr=won+lost>0?Math.round(won/(won+lost)*100):0;
  document.getElementById('kpiRow').innerHTML=
    '<div class="kpi"><div class="kl">Total Quotes</div><div class="kv">'+d.length.toLocaleString()+'</div><div class="ks">filtered records</div></div>'+
    '<div class="kpi"><div class="kl">Total Net Value</div><div class="kv">'+fmt(rev)+'</div><div class="ks">net amount</div></div>'+
    '<div class="kpi"><div class="kl">Open Quotes</div><div class="kv">'+open+'</div><div class="ks">pending decision</div></div>'+
    '<div class="kpi"><div class="kl">Won / Ordered</div><div class="kv">'+won+'</div><div class="ks">win rate '+wr+'%</div></div>'+
    '<div class="kpi"><div class="kl">Lost / Expired</div><div class="kv">'+(lost+expired)+'</div><div class="ks">'+lost+' lost · '+expired+' expired</div></div>';
}

function destroyCharts(){Object.values(charts).forEach(function(c){c.destroy();});charts={};}

function renderContent(){
  destroyCharts();
  var d=filtered;
  var gc='#f1f5f9',tc='#94a3b8';

  document.getElementById('mainContent').innerHTML=
    '<div class="panel w2"><div class="panel-hdr"><h3>Net Value by Sales Org</h3><span class="ph-tag live">LIVE</span></div><div class="panel-body"><canvas id="cOrg"></canvas></div></div>'+
    '<div class="panel"><div class="panel-hdr"><h3>Status Distribution</h3><span class="ph-tag">COUNT</span></div><div class="leg" id="statusLeg"></div><div class="panel-body"><canvas id="cStatus"></canvas></div></div>'+
    '<div class="panel"><div class="panel-hdr"><h3>Quotes Created by Month</h3><span class="ph-tag">TREND</span></div><div class="panel-body"><canvas id="cTrend"></canvas></div></div>'+
    '<div class="panel"><div class="panel-hdr"><h3>Top Customers by Value</h3><span class="ph-tag">TOP 8</span></div><div class="panel-body"><canvas id="cCustomer"></canvas></div></div>'+
    '<div class="panel"><div class="panel-hdr"><h3>Win Rate by Sales Org</h3><span class="ph-tag">%</span></div><div class="panel-body"><canvas id="cWinRate"></canvas></div></div>'+
    '<div class="panel"><div class="panel-hdr"><h3>Quote Value by Phase</h3><span class="ph-tag">PIPELINE</span></div><div class="panel-body"><canvas id="cPhase"></canvas></div></div>'+
    '<div class="tbl-panel"><div class="tbl-hdr"><h3>Sales Quote List</h3><span class="tbl-ct" id="tblCt">—</span></div>'+
    '<table><thead><tr><th>Quote ID</th><th>Name</th><th>Customer</th><th>Sales Org</th><th>Owner</th><th>Net Value</th><th>Status</th><th>Created</th><th>Expires</th><th></th></tr></thead>'+
    '<tbody id="tBody"></tbody></table></div>';

  // Net value by org
  var om={};d.forEach(function(x){var o=(x.SalesOrganisationName||x.SalesOrganisationID||'Unknown').substring(0,22);om[o]=(om[o]||0)+parseFloat(x.TotalNetAmount||x.TotalGrossAmount||0);});
  var os=Object.entries(om).sort(function(a,b){return b[1]-a[1];}).slice(0,8);
  charts.org=new Chart(document.getElementById('cOrg'),{type:'bar',data:{labels:os.map(function(e){return e[0];}),datasets:[{data:os.map(function(e){return e[1];}),backgroundColor:SAP,borderRadius:3,borderSkipped:false}]},options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return' '+fmt(c.raw);}}}},scales:{x:{ticks:{color:tc,font:{size:9}},grid:{color:gc}},y:{ticks:{color:tc,callback:function(v){return fmtN(v);}},grid:{color:gc}}}}});

  // Status donut
  var sm={};d.forEach(function(x){var k=stLabel(x.LifeCycleStatusCode);sm[k]=(sm[k]||0)+1;});
  var ss=Object.entries(sm);
  var rTotal=ss.reduce(function(s,e){return s+e[1];},0);
  document.getElementById('statusLeg').innerHTML=ss.map(function(e){return '<div class="leg-i"><div class="leg-dot" style="background:'+(stColors[e[0]]||'#94a3b8')+'"></div>'+e[0]+' '+(e[1]/rTotal*100).toFixed(1)+'%</div>';}).join('');
  charts.status=new Chart(document.getElementById('cStatus'),{type:'doughnut',data:{labels:ss.map(function(e){return e[0];}),datasets:[{data:ss.map(function(e){return e[1];}),backgroundColor:ss.map(function(e){return stColors[e[0]]||'#94a3b8';}),borderWidth:2,borderColor:'white',hoverOffset:4}]},options:{responsive:true,cutout:'60%',plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return' '+(c.raw/rTotal*100).toFixed(1)+'% ('+c.raw+')';}}}}}});

  // Monthly trend
  var tm={};d.forEach(function(x){var d2=pd(x.CreationDateTime);if(d2&&!isNaN(d2)){var m=d2.toISOString().substring(0,7);tm[m]=(tm[m]||0)+1;}});
  var tms=Object.keys(tm).sort().slice(-12);
  charts.trend=new Chart(document.getElementById('cTrend'),{type:'line',data:{labels:tms,datasets:[{label:'Quotes',data:tms.map(function(m){return tm[m];}),borderColor:'#0a6ed1',backgroundColor:'rgba(10,110,209,0.06)',tension:0.4,fill:true,pointBackgroundColor:'#0a6ed1',pointRadius:3}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:tc,font:{size:8}},grid:{color:gc}},y:{ticks:{color:tc},grid:{color:gc}}}}});

  // Top customers by net value
  var cm={};d.forEach(function(x){var c=(x.BuyerPartyName||'Unknown').substring(0,20);cm[c]=(cm[c]||0)+parseFloat(x.TotalNetAmount||x.TotalGrossAmount||0);});
  var cs=Object.entries(cm).sort(function(a,b){return b[1]-a[1];}).slice(0,8);
  charts.customer=new Chart(document.getElementById('cCustomer'),{type:'bar',data:{labels:cs.map(function(e){return e[0];}),datasets:[{data:cs.map(function(e){return e[1];}),backgroundColor:'rgba(108,50,169,0.75)',borderRadius:3,borderSkipped:false}]},options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return' '+fmt(c.raw);}}}},scales:{x:{ticks:{color:tc,callback:function(v){return fmtN(v);}},grid:{color:gc}},y:{ticks:{color:tc,font:{size:9}},grid:{color:gc}}}}});

  // Win rate by org (won vs lost)
  var wr={};d.forEach(function(x){var o=(x.SalesOrganisationName||x.SalesOrganisationID||'?').substring(0,18);if(!wr[o])wr[o]={won:0,lost:0};if(x.LifeCycleStatusCode==='2')wr[o].won++;if(x.LifeCycleStatusCode==='3')wr[o].lost++;});
  var wrs=Object.entries(wr).filter(function(e){return e[1].won+e[1].lost>=1;}).map(function(e){return{k:e[0],r:e[1].won+e[1].lost>0?e[1].won/(e[1].won+e[1].lost)*100:0,total:e[1].won+e[1].lost};}).sort(function(a,b){return b.r-a.r;}).slice(0,8);
  charts.winRate=new Chart(document.getElementById('cWinRate'),{type:'bar',data:{labels:wrs.map(function(e){return e.k;}),datasets:[{data:wrs.map(function(e){return e.r;}),backgroundColor:wrs.map(function(e){return e.r>=50?'#107e3e':e.r>=25?'#0a6ed1':'#e9730c';}),borderRadius:3,borderSkipped:false}]},options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return' '+c.raw.toFixed(1)+'%';}}}},scales:{x:{ticks:{color:tc,font:{size:9}},grid:{color:gc}},y:{ticks:{color:tc,callback:function(v){return v+'%';}},grid:{color:gc},max:100}}}});

  // Value by sales phase
  var pm={};d.forEach(function(x){var p=x.SalesCyclePhaseCodeText||'(Unknown)';pm[p]=(pm[p]||0)+parseFloat(x.TotalNetAmount||x.TotalGrossAmount||0);});
  var ps=Object.entries(pm).sort(function(a,b){return b[1]-a[1];}).slice(0,6);
  charts.phase=new Chart(document.getElementById('cPhase'),{type:'bar',data:{labels:ps.map(function(e){return e[0].substring(0,16);}),datasets:[{data:ps.map(function(e){return e[1];}),backgroundColor:SAP.slice(0,ps.length),borderRadius:3,borderSkipped:false}]},options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return' '+fmt(c.raw);}}}},scales:{x:{ticks:{color:tc,font:{size:9}},grid:{color:gc}},y:{ticks:{color:tc,callback:function(v){return fmtN(v);}},grid:{color:gc}}}}});

  // Table — sorted by net value desc
  var rows=d.slice().sort(function(a,b){return parseFloat(b.TotalNetAmount||b.TotalGrossAmount||0)-parseFloat(a.TotalNetAmount||a.TotalGrossAmount||0);}).slice(0,50);
  document.getElementById('tblCt').textContent='Top 50 of '+d.length.toLocaleString();
  document.getElementById('tBody').innerHTML=rows.map(function(row){
    var val=parseFloat(row.TotalNetAmount||row.TotalGrossAmount||0);
    var link=C4C_BASE+'&param.InternalID='+row.ID+'&param.Type=COD_SALESQUOTE_THINGTYPE';
    return '<tr>'+
      '<td style="font-family:monospace;font-size:0.68rem;color:var(--muted)">'+(row.ID||'—')+'</td>'+
      '<td style="font-weight:500;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(row.Name||'—')+'</td>'+
      '<td style="color:var(--muted);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(row.BuyerPartyName||'—')+'</td>'+
      '<td style="color:var(--muted);font-size:0.7rem">'+(row.SalesOrganisationName||row.SalesOrganisationID||'—')+'</td>'+
      '<td style="color:var(--muted);font-size:0.7rem">'+(row.MainEmployeeResponsiblePartyName||'—')+'</td>'+
      '<td style="font-weight:600;color:var(--blue)">'+fmt(val)+'</td>'+
      '<td><span class="badge '+stClass(row.LifeCycleStatusCode)+'">'+stLabel(row.LifeCycleStatusCode)+'</span></td>'+
      '<td style="color:var(--muted);font-size:0.7rem">'+pds(row.CreationDateTime)+'</td>'+
      '<td style="color:var(--muted);font-size:0.7rem">'+pds(row.ExpirationDate)+'</td>'+
      '<td><a class="c4c-link" href="'+link+'" target="_blank">Open<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 2h3v3M10 2 5 7M4 3H2v7h7V8"/></svg></a></td>'+
      '</tr>';
  }).join('');
}

async function init(){
  try{
    allData=await fetchAll();
    var now=new Date();
    document.getElementById('lastUpdate').textContent='Updated '+now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    document.getElementById('pageSub').textContent=now.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})+' · C4C QUA · MY352500 · '+allData.length.toLocaleString()+' quotes';
    populateFilters(allData);
    applyFilters();
  }catch(e){
    document.getElementById('mainContent').innerHTML='<div style="grid-column:span 3;padding:48px;color:var(--red);font-size:0.85rem;text-align:center;">Error loading Sales Quote data: <b>'+e.message+'</b></div>';
    document.getElementById('pageSub').textContent='Error — check C4C destination access to SalesQuoteCollection';
  }
}
init();
</script>
</body>
</html>
