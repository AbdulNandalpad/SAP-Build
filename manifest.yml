---
applications:

- name: tss-cx-analytics
  memory: 512M
  disk_quota: 1G
  instances: 1
  buildpacks:
    - nodejs_buildpack
  command: npm start
  routes:
    - route: tss-cx-analytics-backend.apps.internal
  services:
    - cx-destination
    - tss-dev-uaa
  env:
    NODE_ENV: production

- name: tss-cx-analytics-router
  memory: 256M
  disk_quota: 512M
  instances: 1
  buildpacks:
    - nodejs_buildpack
  path: approuter
  routes:
    - route: tss-cx-analytics.cfapps.eu10.hana.ondemand.com
  services:
    - tss-dev-uaa
  env:
    destinations: >
      [{"name":"tss-backend","url":"http://tss-cx-analytics-backend.apps.internal:8080","forwardAuthToken":true}]
